services:
  model-api:
    build:
      context: .
      dockerfile: model-api/Dockerfile
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
      CORS_ORIGINS: ${PORTAL_ORIGIN:-http://localhost:3000}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 4s
      retries: 5
  market-api:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./market-api:/workspace
      - ./training_data.csv:/data/training_data.csv:ro
    command: mvn spring-boot:run
    environment:
      HOUSING_DATA_FILE: /data/training_data.csv
      ML_API_URL: http://model-api:8000
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:3000}
    ports: ["8081:8081"]
    depends_on:
      model-api:
        condition: service_healthy
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      MODEL_API_URL: http://model-api:8000
      MARKET_API_URL: http://market-api:8081
    ports: ["3000:3000"]
    depends_on: [model-api, market-api]
